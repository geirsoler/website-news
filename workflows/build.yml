name: Build and Deploy Articles

on:
  push:
    branches:
      - main
    paths:
      - 'news.json'
      - 'build-news.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Sjekk ut kildekode
        uses: actions/checkout@v4

      - name: Sett opp Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generer statiske artikler
        run: node build-news.js

      - name: Commit og push genererte HTML-filer
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add news/
          # Commit bare hvis det finnes faktiske endringer
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-generate static news pages per year" && git push)
