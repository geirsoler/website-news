<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="author" content="Geir Soler&oslash;d">
    <link rel="icon" type="image/svg+xml" href="my-favicons/favicon.svg">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,600;0,6..96,700;1,6..96,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- Felles CSS -->

    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        h1 {
            font-family: 'Bodoni Moda', serif;
            font-size: clamp(2.4rem, 5vw, 3.8rem);
            color: var(--text-bright);
            letter-spacing: 1px;
            margin-bottom: 0.4rem;
            font-weight: 600;
            line-height: 1.1;
        }

        .container {
            max-width: 680px;
            margin: auto;
            padding: 2.5rem 1.5rem;
            width: 100%;
        }

        .thank-you-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 3rem 2rem;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        h2 {
            font-family: 'Bodoni Moda', serif;
            font-size: 1.85rem;
            color: var(--text-bright);
            margin-bottom: 1rem;
            letter-spacing: 0.6px;
            font-weight: 600;
        }

        p {
            font-size: 1rem;
            color: var(--text);
            margin-bottom: 2rem;
            line-height: 1.7;
        }

        @media (max-width: 850px) {
            header {
                padding: 1.8rem 1rem 1rem !important;
            }

            .container {
                padding: 1.5rem 1rem 3rem !important;
            }

            .thank-you-card {
                padding: 2.2rem 1.5rem;
            }

            h2 {
                font-size: 1.55rem;
            }
        }
    </style>
</head>

    <header id="top">
        <h1>Geir Soler&oslash;d</h1>
        <div class="subtitle">Composer &bull; Lyricist &bull; Arranger</div>

    <main class="container">
        <div class="thank-you-card">
            <h2>Message Sent</h2>
            <p>Thank you for reaching out. Your inquiry has been received, and I will get back to you as soon as possible.</p>
            <a href="index.html" class="btn btn-primary" style="display: inline-flex; align-items: center; gap: 0.45rem;">
                <img src="svg/home-svgrepo-com.svg" alt="Home" class="table-icon icon-home" style="filter: brightness(0);">
                <span>Return to Home</span>

    <footer id="footer">
        <div style="margin-bottom: 1.25rem; display: flex; justify-content: center; gap: 1.5rem; flex-wrap: wrap;">

            <span style="color: var(--border);">&bull;</span>
            <a href="https://www.scoreexchange.com/profiles/geir-solerod" target="_blank" rel="noopener" style="color: var(--accent); text-decoration: none; font-size: 0.9rem;">Score Exchange Profile</a>
        </div>
