name: Build and Deploy Articles

on:
  push:
    branches:
      - main
    paths:
      - 'news.json'
      - 'js/build-news.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Sjekk ut kildekode
        uses: actions/checkout@v4

      - name: Sett opp Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generer statiske artikler
        run: node js/build-news.js

      - name: Commit og push genererte HTML-filer
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add news/
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "Auto-generate static news pages per year"
            git pull --rebase origin main
            git push origin main
          fi
